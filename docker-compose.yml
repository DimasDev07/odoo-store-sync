# Local sandbox for manual testing: an Odoo 18 and a PrestaShop 8 to sync between.
# Everything here is for development only; the credentials are throwaway.
#
#   docker compose up -d
#   Odoo:        http://localhost:8069        (create a database named "odoo" on first visit)
#   PrestaShop:  http://localhost:8080        (back office: http://localhost:8080/admin-dev)
#
# PrestaShop installs itself on first start and takes a few minutes.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - odoo-db:/var/lib/postgresql/data

  odoo:
    image: odoo:18
    depends_on:
      - db
    ports:
      - "8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - odoo-data:/var/lib/odoo

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: prestashop
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-padmin"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - prestashop-db:/var/lib/mysql

  prestashop:
    image: prestashop/prestashop:8-apache
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      PS_INSTALL_AUTO: "1"
      DB_SERVER: mysql
      DB_NAME: prestashop
      DB_USER: root
      DB_PASSWD: admin
      PS_DOMAIN: localhost:8080
      PS_FOLDER_ADMIN: admin-dev
      PS_FOLDER_INSTALL: install-dev
      PS_ENABLE_SSL: "0"
      PS_LANGUAGE: en
      PS_COUNTRY: ES
      ADMIN_MAIL: admin@example.com
      ADMIN_PASSWD: admin12345
    volumes:
      - prestashop-data:/var/www/html

volumes:
  odoo-db:
  odoo-data:
  prestashop-db:
  prestashop-data:
